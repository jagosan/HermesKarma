<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="wingGradLeft" x1="100%" y1="50%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wingGradRight" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark base icon container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#272a38" stroke-width="2.5"/>

  <!-- Outer Telemetry Radar Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.35"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>

  <!-- Left Hermes Wing -->
  <g id="leftWing" opacity="0.95">
    <!-- Top feather -->
    <path d="M 60 52 C 46 38, 22 26, 12 36 C 18 48, 38 52, 58 56 Z" fill="url(#wingGradLeft)"/>
    <!-- Middle feather -->
    <path d="M 58 58 C 42 50, 18 46, 14 58 C 22 66, 42 64, 58 64 Z" fill="url(#wingGradLeft)" opacity="0.85"/>
    <!-- Lower feather -->
    <path d="M 58 66 C 44 64, 26 66, 22 76 C 30 82, 46 76, 59 72 Z" fill="url(#wingGradLeft)" opacity="0.7"/>
  </g>

  <!-- Right Hermes Wing -->
  <g id="rightWing" opacity="0.95">
    <!-- Top feather -->
    <path d="M 68 52 C 82 38, 106 26, 116 36 C 110 48, 90 52, 70 56 Z" fill="url(#wingGradRight)"/>
    <!-- Middle feather -->
    <path d="M 70 58 C 86 50, 110 46, 114 58 C 106 66, 86 64, 70 64 Z" fill="url(#wingGradRight)" opacity="0.85"/>
    <!-- Lower feather -->
    <path d="M 70 66 C 84 64, 102 66, 106 76 C 98 82, 82 76, 69 72 Z" fill="url(#wingGradRight)" opacity="0.7"/>
  </g>

  <!-- Central Karma Telemetry Wheel (8-Spoke Dharma / Observability Dial) -->
  <g id="karmaWheel" filter="url(#glow)">
    <!-- Wheel Outer Rim -->
    <circle cx="64" cy="64" r="25" fill="#0f1117" stroke="url(#wheelGrad)" stroke-width="3"/>
    <!-- Wheel Inner Rim -->
    <circle cx="64" cy="64" r="16" fill="none" stroke="url(#wheelGrad)" stroke-width="1.5" opacity="0.6"/>

    <!-- 8 Precision Radial Spokes -->
    <line x1="64" y1="39" x2="64" y2="89" stroke="url(#wheelGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="39" y1="64" x2="89" y2="64" stroke="url(#wheelGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="46.3" y1="46.3" x2="81.7" y2="81.7" stroke="url(#wheelGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="81.7" y1="46.3" x2="46.3" y2="81.7" stroke="url(#wheelGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- 8 Outer Nodes / Telltales -->
    <circle cx="64" cy="39" r="2" fill="#38bdf8"/>
    <circle cx="64" cy="89" r="2" fill="#38bdf8"/>
    <circle cx="39" cy="64" r="2" fill="#38bdf8"/>
    <circle cx="89" cy="64" r="2" fill="#38bdf8"/>
    <circle cx="46.3" cy="46.3" r="1.8" fill="#a855f7"/>
    <circle cx="81.7" cy="81.7" r="1.8" fill="#a855f7"/>
    <circle cx="81.7" cy="46.3" r="1.8" fill="#a855f7"/>
    <circle cx="46.3" cy="81.7" r="1.8" fill="#a855f7"/>

    <!-- Glowing Telemetry Hub -->
    <circle cx="64" cy="64" r="7" fill="url(#goldGrad)"/>
    <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
  </g>
</svg>